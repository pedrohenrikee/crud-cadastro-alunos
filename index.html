<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
</head>
<body>
    <h1>Cadastrar Aluno</h1>
     <form id="form-cadastro" action="/enviar" method="post" novalidate>

      <fieldset>
        <label for="nome">Nome completo <span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail <span class="req" aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email" required>

        <label for="celular">Celular <span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="celular" name="celular" required>

        <label for="cep">CEP <span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="cep" name="cep" required>

        <label for="estado">Estado<span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="estado" name="estado" required>

        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" required>
      </fieldset>

    <button id="btn-cadastrar" type="submit">Cadastrar</button>
    <button id="btn-limpar" type="reset">Limpar Lista</button>
    </form>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Celular</th>
                    <th>Email</th>
                    <th>Cidade</th>
                    <th>Estado</th>
                    <th>CEP</th>
                </tr>
            </thead>
            <tbody id="alunosTableBody">
                <!-- Os dados dos alunos serão inseridos aqui -->
            </tbody>
        </table>
    </form>
</body>
</html>
